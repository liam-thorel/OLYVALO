<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Touches du livechat</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; padding: 18px; background: #12151c; color: #e8e8ee; font-size: 13px; user-select: none; }
    h1 { margin: 0 0 4px; font-size: 15px; }
    p { margin: 0 0 14px; color: #9aa0ad; line-height: 1.45; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: rgba(255,255,255,.03); }
    .row strong { font-size: 13px; }
    .row kbd { justify-self: end; padding: 4px 9px; border: 1px solid rgba(255,255,255,.2); border-bottom-width: 2px; border-radius: 6px; background: #1b1f29; font: 600 12px 'Segoe UI', sans-serif; }
    .row kbd.wait { border-color: #ff4655; color: #ff8a95; }
    .actions { grid-column: 1 / -1; display: flex; gap: 6px; }
    button { border: 1px solid rgba(255,255,255,.16); border-radius: 6px; background: #1b1f29; color: inherit; padding: 6px 10px; cursor: pointer; font-size: 12px; }
    button:hover { border-color: rgba(255,255,255,.4); }
    button.main { background: #ff4655; border-color: #ff4655; color: #fff; font-weight: 600; }
    .status { min-height: 18px; color: #9aa0ad; font-size: 12px; }
    .status.err { color: #ff8a95; }
    .status.ok { color: #6bd990; }
    .missing { padding: 12px; border-radius: 8px; background: rgba(255,70,85,.1); color: #ffb3ba; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>📺 Touches du livechat</h1>
  <p>Le livechat d'OLYCITY Live sur ce PC. Clique sur « Changer », puis appuie sur la touche ou la combinaison voulue (Ctrl, Maj, Alt, Win et les boutons 4/5 de la souris marchent). Échap annule.</p>
  <div id="content"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <script>
    const ACTIONS = { toggle: 'Couper / réactiver le livechat', skip: 'Passer la vidéo en cours' };
    const $ = id => document.getElementById(id);
    let waiting = null;

    const status = (text, kind = '') => { $('status').textContent = text; $('status').className = `status ${kind}`; };

    async function render() {
      const state = await window.livechatKeys.read();
      if (!state.found) {
        $('content').innerHTML = '<div class="missing">OLYCITY Live introuvable sur ce PC, ou trop ancien (4.24.2 nécessaire). Lance-le une fois : il se met à jour tout seul, puis rouvre cette fenêtre. Sinon, les touches se règlent avec LIVECHAT.bat dans son dossier.</div>';
        return;
      }
      $('content').innerHTML = Object.entries(ACTIONS).map(([action, label]) => `
        <div class="row">
          <strong>${label}</strong>
          <kbd id="kbd-${action}" class="${waiting === action ? 'wait' : ''}">${waiting === action ? 'Appuie sur une touche…' : state.labels[action]}</kbd>
          <div class="actions">
            <button type="button" class="main" data-change="${action}">Changer</button>
            <button type="button" data-reset="${action}">Par défaut</button>
            <button type="button" data-remove="${action}">Retirer</button>
          </div>
        </div>`).join('') + `<p>Livechat actuellement ${state.enabled ? '<b>activé</b>' : '<b>coupé</b>'} sur ce PC. Les changements sont pris en compte en quelques secondes, sans redémarrer.</p>`;
    }

    async function finish(result) {
      waiting = null;
      if (result?.error) status(result.error, 'err');
      else if (result?.ok) status('Touche enregistrée.', 'ok');
      else if (result?.cancel) status('Annulé.');
      await render();
    }

    document.addEventListener('click', async event => {
      const change = event.target.closest('[data-change]');
      const reset = event.target.closest('[data-reset]');
      const remove = event.target.closest('[data-remove]');
      if (change) { waiting = change.dataset.change; status(''); await render(); return; }
      if (reset) await finish(await window.livechatKeys.reset(reset.dataset.reset));
      if (remove) await finish(await window.livechatKeys.remove(remove.dataset.remove));
    });

    document.addEventListener('keydown', async event => {
      if (!waiting) return;
      event.preventDefault();
      const result = await window.livechatKeys.captureKeyboard(waiting, event);
      if (result) await finish(result); // null : un modificateur seul, on attend la suite
    });

    // Boutons 4/5 et molette : sans ça, « précédent » ferait aussi naviguer.
    document.addEventListener('mousedown', async event => {
      if (!waiting || ![1, 3, 4].includes(event.button)) return;
      event.preventDefault();
      await finish(await window.livechatKeys.captureMouse(waiting, event));
    });
    document.addEventListener('mouseup', event => { if ([3, 4].includes(event.button)) event.preventDefault(); });

    render();
  </script>
</body>
</html>
