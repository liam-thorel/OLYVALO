name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:      # réutilisé comme garde-fou par le workflow de déploiement

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Aucune dépendance à installer : la suite ne teste que des modules purs,
      # sans discord.js ni ws (volontairement, pour rester exécutable partout).
      - name: Suite de tests
        run: node --test "tests/*.test.*"
