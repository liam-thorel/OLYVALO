name: Déploiement du Worker livechat

# Le Worker workers/livechat (envois du site et de l'extension, liens vidéo,
# réactivation à distance) se déployait à la main avec `wrangler deploy`.
# Un oubli et le site, l'extension ou le bot parlent à une version périmée.
#
# Actif dès que le secret CLOUDFLARE_API_TOKEN existe (Settings → Secrets and
# variables → Actions), avec CLOUDFLARE_ACCOUNT_ID si le jeton voit plusieurs
# comptes. Sans lui, le job s'arrête proprement : rien n'échoue.
on:
  push:
    branches: [main]
    paths: ['workers/livechat/**']
  workflow_dispatch:

concurrency:
  group: deploy-livechat-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la présence du jeton Cloudflare
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Secret CLOUDFLARE_API_TOKEN absent : déploie à la main (npx wrangler deploy dans workers/livechat)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Tests du Worker
        if: steps.token.outputs.present == 'true'
        run: node --test tests/livechat-worker.test.mjs tests/livechat-links.test.mjs

      - name: Déployer
        if: steps.token.outputs.present == 'true'
        working-directory: workers/livechat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
