name: Déploiement du bot Discord

# Ne se déclenche que quand le bot change : une modification du site ou du
# script live ne redémarre pas inutilement le bot en production.
on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:    # déclenchement manuel depuis l'onglet Actions

# Deux merges rapprochés ne doivent pas déployer en parallèle sur la même VM.
concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  # Garde-fou : un merge qui casse les tests ne part jamais en production.
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Le mini-PC est à la maison, sans port ouvert : le runner rejoint le réseau
      # Tailscale le temps du déploiement pour l'atteindre en SSH.
      - name: Rejoindre le réseau Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::Secret DEPLOY_SSH_KEY absent."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Déployer et redémarrer
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$HOST" && test -n "$USER" || { echo "::error::Secrets DEPLOY_HOST / DEPLOY_USER absents."; exit 1; }
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/olycity-bot"
          CONTAINER="olycity-bot"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          echo "→ Téléchargement de main"
          curl -fsSL https://github.com/liam-thorel/OLYVALO/archive/refs/heads/main.tar.gz -o "$TMP/oly.tar.gz"
          tar -xzf "$TMP/oly.tar.gz" -C "$TMP"

          # Fusion sans suppression : .env n'est pas dans le dépôt, il est donc
          # préservé tel quel.
          echo "→ Synchronisation de discord-bot/"
          mkdir -p "$APP_DIR"
          cp -r "$TMP/OLYVALO-main/discord-bot/." "$APP_DIR/"

          cd "$APP_DIR"
          echo "→ Reconstruction et redémarrage de $CONTAINER"
          docker compose up -d --build --force-recreate
          docker image prune -f >/dev/null

          # Le bot fait process.exit(1) sur toute exception non capturée et Docker
          # le relance aussitôt : un conteneur « running » ne suffit donc pas, il
          # ne doit pas non plus avoir redémarré depuis sa création.
          sleep 8
          state="$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "$CONTAINER")"
          if [ "$state" = "true 0" ]; then
            echo "✅ $CONTAINER est en ligne"
          else
            echo "::error::$CONTAINER n'est pas en ligne après le déploiement ($state)"
            docker logs --tail 40 "$CONTAINER" || true
            exit 1
          fi
          REMOTE

      - name: Effacer la clé
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
