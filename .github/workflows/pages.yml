name: Déploiement du site

# Le site n'est redéployé que quand son contenu change : une modification du
# bot ou des tests n'a rien à publier.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'discord-bot/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Un site cassé ne doit pas partir en ligne.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copie explicite plutôt qu'exclusions : ce qui n'est pas listé n'est pas
      # publié. tests/database-site-assets vérifie que cette liste couvre bien
      # tout ce que le site charge réellement.
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp index.html .nojekyll manifest.webmanifest sw.js _site/
          cp -r assets css js data _site/
          # Le panneau admin lit ce manifeste pour afficher la version du
          # script attendue. Le reste de live/ (dont le ZIP de 34 Mo) n'a rien
          # à faire sur Pages : il est distribué par les Releases GitHub.
          mkdir -p _site/live
          cp live/update-manifest.json _site/live/
          # Un Service Worker au contenu identique n'émet aucun updatefound.
          # Le SHA rend chaque déploiement détectable, y compris dans la PWA
          # mobile ou dans un onglet resté ouvert plusieurs heures.
          sed -i "s/__OLYCITY_BUILD_ID__/${GITHUB_SHA}/g" _site/sw.js
          ! grep -q '__OLYCITY_BUILD_ID__' _site/sw.js
          du -sh _site

      - name: Injecter la configuration publique
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          GAME_CATALOG_ENDPOINT: ${{ vars.GAME_CATALOG_ENDPOINT }}
          NOTIFICATION_ENDPOINT: ${{ vars.NOTIFICATION_ENDPOINT }}
        run: |
          # Encodage via JSON.stringify : aucune valeur de configuration ne
          # peut casser le module si elle contient un caractère spécial.
          printf 'export const CONFIG = {\n  HENRIK_API_KEY: %s,\n  GAME_CATALOG_ENDPOINT: %s,\n  NOTIFICATION_ENDPOINT: %s,\n};\n' \
            "$(node -p 'JSON.stringify(process.env.HENRIK_API_KEY || "")')" \
            "$(node -p 'JSON.stringify(process.env.GAME_CATALOG_ENDPOINT || "")')" \
            "$(node -p 'JSON.stringify(process.env.NOTIFICATION_ENDPOINT || "")')" > _site/config.js
          if [ -z "$HENRIK_API_KEY" ]; then
            echo "::notice::Aucun secret HENRIK_API_KEY — chaque visiteur renseignera sa clé depuis la page Roster."
          fi
          if [ -z "$GAME_CATALOG_ENDPOINT" ]; then
            echo "::notice::Aucune variable GAME_CATALOG_ENDPOINT — la saisie manuelle des jeux restera disponible."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
