name: Package de l'overlay

# L'overlay a son propre rythme de publication. Le mêler au workflow du script
# Live obligerait à bumper la version du Live — et donc à pousser une mise à
# jour sur tous les postes — juste pour republier un exécutable qui n'a rien à
# voir avec lui.
#
# Deux déclencheurs :
#   - un tag `v*` : l'exécutable est joint à cette release ;
#   - manuellement : on CONSTRUIT depuis la branche courante et on JOINT à la
#     release demandée. C'est ce qui permet d'attacher l'overlay à une release
#     déjà publiée avant que le dossier overlay/ n'existe — un checkout de ce
#     tag-là ne contiendrait tout simplement pas le code à compiler.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release à laquelle joindre l’exécutable (ex. v4.17.11)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-overlay-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # windows-latest est le seul runner qui produise un .exe sans compilation
    # croisée.
    runs-on: windows-latest
    steps:
      # Sur un tag, on compile le code de ce tag. En manuel, on compile la
      # branche par défaut : le tag visé sert alors uniquement de destination.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.ref_name }}

      # Les tags antérieurs à l'introduction de l'overlay n'ont pas ce dossier.
      # On sort proprement plutôt que de faire échouer une release de script.
      - name: Vérifier que l'overlay existe à cette révision
        id: guard
        shell: bash
        run: |
          if [ -f overlay/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de dossier overlay/ à cette révision — rien à construire."
          fi

      # Le tag est saisi à la main dans le formulaire : un espace avant ou
      # après ne se voit pas, et « v4.17.11 » avec une espace en tête a déjà
      # coûté une construction complète avant d'échouer au téléversement.
      - name: Normaliser le tag visé
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ inputs.tag || github.ref_name }}'
          clean=$(printf '%s' "$raw" | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          [ -n "$clean" ] || { echo "::error::Aucun tag fourni."; exit 1; }
          [ "$clean" = "$raw" ] || echo "::notice::Tag normalisé : « $raw » → « $clean »"
          echo "value=$clean" >> "$GITHUB_OUTPUT"

      # Construire pendant trois minutes pour découvrir ensuite que la release
      # de destination n'existe pas est une perte sèche. On le vérifie tout de
      # suite — sauf sur un push de tag, où la release est encore en train
      # d'être créée par le workflow du Live.
      - name: Vérifier que la release de destination existe
        if: steps.guard.outputs.present == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.tag.outputs.value }}'
          if ! gh release view "$tag" --repo '${{ github.repository }}' > /dev/null 2>&1; then
            echo "::error::La release $tag n'existe pas. Releases disponibles :"
            gh release list --repo '${{ github.repository }}' --limit 10
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: '22'

      - name: Installer les dépendances
        if: steps.guard.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: overlay

      - name: Construire l'exécutable
        if: steps.guard.outputs.present == 'true'
        run: npm run build
        working-directory: overlay

      # On échoue ici plutôt que de téléverser un fichier absent et de laisser
      # la page Live afficher un lien mort.
      # latest.yml décrit la version publiée : c'est LUI que l'application
      # installée interroge pour savoir qu'une mise à jour existe. Sans ce
      # fichier sur la release, l'auto-update échoue silencieusement.
      - name: Vérifier les fichiers de publication
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd overlay/dist
          for required in OLYCITY-Overlay-Setup.exe latest.yml; do
            [ -f "$required" ] || { echo "::error::$required introuvable"; ls -R .; exit 1; }
          done
          # La version annoncée doit correspondre au paquet, sinon les postes
          # retéléchargeraient en boucle une mise à jour qui ne s'applique pas.
          declared=$(grep -E '^version:' latest.yml | head -1 | sed 's/version: *//' | tr -d '\r')
          expected=$(node -p "require('../package.json').version")
          echo "latest.yml annonce $declared, package.json dit $expected"
          [ "$declared" = "$expected" ] || { echo "::error::versions incohérentes"; exit 1; }
          ls -lh

      - name: Joindre à la release
        if: steps.guard.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.tag.outputs.value }}'
          # La release peut ne pas exister encore lors d'un push de tag : le
          # workflow du Live la crée de son côté, on l'attend brièvement plutôt
          # que d'échouer sur une course entre les deux.
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" --repo '${{ github.repository }}' > /dev/null 2>&1; then
              # Le .blockmap permet à electron-updater de ne télécharger que
              # les octets qui changent d'une version à l'autre.
              files=(overlay/dist/OLYCITY-Overlay-Setup.exe overlay/dist/latest.yml)
              # Sans `|| true`, un glob qui ne correspond à rien fait échouer
              # l'étape sous `set -e` alors que le .blockmap est facultatif.
              for extra in overlay/dist/*.blockmap; do
                [ -f "$extra" ] && files+=("$extra") || true
              done
              gh release upload "$tag" "${files[@]}" --clobber --repo '${{ github.repository }}'
              exit 0
            fi
            echo "Release $tag pas encore publiée — nouvelle tentative dans 20 s ($attempt/6)"
            sleep 20
          done
          echo "::error::La release $tag n'existe pas."
          exit 1
