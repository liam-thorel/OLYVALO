name = "olycity-livechat"
main = "worker.mjs"
compatibility_date = "2026-10-20"

[vars]
SITE_ORIGIN = "https://olycity.fr,https://www.olycity.fr,https://tracker.olycity.fr"
FIREBASE_ROOT = "https://realtime-database-5bb9f-default-rtdb.europe-west1.firebasedatabase.app"

# Médias envoyés depuis le site (500 Mo max), effacés au bout d'un jour par
# une règle de cycle de vie du bucket (voir README).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "olycity-livechat-media"

# Secret, jamais dans le dépôt :
#   wrangler secret put DISCORD_WEBHOOK_URL
